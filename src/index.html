<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white min-h-screen">
  <!-- Chat Container -->
  <div class="flex h-screen bg-white flex-col md:flex-row">
    <!-- Sidebar -->
    <div id="sidebar"
      class="w-full md:w-64 bg-gray-900 text-white flex flex-col h-auto md:h-full shadow-lg absolute md:relative z-50 md:z-auto left-0 top-0 md:top-auto hidden md:flex transition-all duration-300">
      <!-- Header -->
      <div class="p-4 border-b border-gray-700 flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold">Chat App</h2>
          <p class="text-sm text-gray-400 mt-2">
            Logged in as <span class="font-semibold text-gray-300" id="currentUser">User</span>
          </p>
        </div>
        <button id="closeSidebarBtn" class="md:hidden text-gray-300 hover:text-white text-2xl">
          ✕
        </button>
      </div>

      <!-- Rooms List -->
      <div class="flex-1 overflow-y-auto p-4 flex flex-col">
        <div class="mb-4 flex-1 overflow-y-auto">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">
            Chat Rooms
          </h3>

          <!-- Dynamic Rooms Container -->
          <div id="roomsList" class="space-y-2">
            <!-- Rooms will be dynamically inserted here -->
          </div>

          <!-- No rooms message -->
          <div id="noRoomsMessage" class="p-3 bg-gray-800 rounded-lg text-sm text-gray-400 text-center hidden">
            No active chat rooms
          </div>
        </div>

        <!-- Create Room Section -->
        <div id="createRoomButton" class="mb-4">
          <button id="toggleCreateBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm py-2 rounded-lg transition">
            + Create Room
          </button>
        </div>

        <form id="createRoomForm" class="hidden space-y-2 mb-4">
          <label for="roomNameInput" class="block text-xs md:text-sm font-medium text-gray-300 mb-1">
            Room Name
          </label>
          <input id="roomNameInput" type="text" placeholder="Room name" autocomplete="off"
            class="w-full px-3 py-2 rounded bg-gray-800 text-white placeholder-gray-500 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
            required />
          <div class="flex gap-2">
            <button type="submit" id="createRoomSubmitBtn"
              class="flex-1 bg-green-600 hover:bg-green-700 text-white text-sm py-1 rounded transition">
              Create
            </button>
            <button type="button" id="cancelCreateBtn"
              class="flex-1 bg-gray-700 hover:bg-gray-600 text-white text-sm py-1 rounded transition">
              Cancel
            </button>
          </div>
        </form>
      </div>

      <!-- Logout Button -->
      <div class="p-4 border-t border-gray-700">
        <button id="logoutBtn"
          class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg transition">
          Logout
        </button>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col w-full">
      <!-- Room Header -->
      <div class="border-b border-gray-200 bg-white px-4 md:px-6 py-4 shadow-sm flex items-center justify-between">
        <button id="toggleSidebarBtn"
          class="md:hidden bg-gray-900 text-white p-2 rounded mr-2 hover:bg-gray-800 transition">
          ☰
        </button>
        <div class="flex-1">
          <h2 id="roomName" class="text-xl md:text-2xl font-bold text-gray-800">#general</h2>
          <p id="roomMembers" class="text-xs md:text-sm text-gray-600 mt-1">
            0 members in this room
          </p>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto bg-gray-50 p-3 md:p-6 space-y-4">
        <!-- Messages will be dynamically inserted here -->
      </div>

      <!-- Message Input Area -->
      <form id="messageForm" class="border-t border-gray-200 bg-white p-3 md:p-4 flex gap-2">
        <label for="messageInput" class="sr-only">
          Message
        </label>
        <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off"
          class="flex-1 px-3 md:px-4 py-2 text-sm md:text-base border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button type="submit" id="sendBtn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 md:px-6 py-2 rounded-lg transition text-sm md:text-base">
          Send
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const currentUser = localStorage.getItem('chat_app_current_user');
      if (!currentUser) {
        window.location.href = '/signin/signin.html';
      }

      // Sidebar toggle functionality
      const sidebar = document.getElementById('sidebar');
      const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
      const closeSidebarBtn = document.getElementById('closeSidebarBtn');

      if (toggleSidebarBtn) {
        toggleSidebarBtn.addEventListener('click', () => {
          sidebar.classList.toggle('hidden');
        });
      }

      if (closeSidebarBtn) {
        closeSidebarBtn.addEventListener('click', () => {
          sidebar.classList.add('hidden');
        });
      }

      // Close sidebar when a room is clicked (mobile)
      document.addEventListener('click', (e) => {
        if (e.target.closest('#roomsList') && window.innerWidth < 768) {
          sidebar.classList.add('hidden');
        }
      });
    })();
  </script>

  <script type="module" src="./index.js"></script>
</body>

</html>
